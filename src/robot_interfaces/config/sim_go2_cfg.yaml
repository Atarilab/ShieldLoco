ROBOT: "go2"
SCENE: "scene.xml"
ELASTIC_BAND: False
BASE_LINK: "base_link"

SIMULATION_DT: 0.005
VIEWER_DT: 0.02  # 50 fps for viewer
WEB_VIEWER_BACKEND: "viser"  # "none" | "viser"
WEB_VIEWER_HOST: "0.0.0.0"
WEB_VIEWER_PORT: 8080
WEB_VIEWER_DT: 0.03  # ~33 fps for web updates
WEB_VIEWER_SHARE_URL: False
WEB_VIEWER_SHOW_BASE: True
WEB_VIEWER_SHOW_COLLISIONS: True
WEB_VIEWER_COLLISION_GROUP: null  # Show all collidable geoms, including world obstacles
WEB_VIEWER_COLLISION_OPACITY: 0.8
WEB_VIEWER_COLLISION_WIREFRAME: False
WEB_VIEWER_COLLISION_COLOR: [255, 120, 80]
WEB_VIEWER_SHOW_OPT_CONTACT_LOCATIONS: True
WEB_VIEWER_OPT_CONTACT_TOPIC: "opt_contact_locations"
WEB_VIEWER_OPT_CONTACT_RADIUS: 0.02
WEB_VIEWER_OPT_CONTACT_COLOR: [0, 255, 0]
WEB_VIEWER_SHOW_ACTUAL_CONTACT_LOCATIONS: True
WEB_VIEWER_ACTUAL_CONTACT_RADIUS: 0.02
WEB_VIEWER_ACTUAL_CONTACT_COLOR: [0, 120, 255]
WEB_VIEWER_ACTUAL_CONTACT_BODIES: ["FL_foot", "FR_foot", "RL_foot", "RR_foot"]
# Explicit bodies to track. If omitted, WEB_VIEWER_AUTO_TRACK_FILTERS is used.
WEB_VIEWER_TRACKED_BODIES: ["FL_foot", "FR_foot", "RL_foot", "RR_foot"]
PRINT_SCENE_INFORMATION: True
INTERFACE: "lo"
DOMAIN_ID: 1