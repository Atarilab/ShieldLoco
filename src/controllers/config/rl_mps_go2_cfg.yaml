# TODO: Clean this config

# policy_path: "contact_policy_actuatorRand.pt"
# policy_path: "locomotion_go2/contact_policy_feetRandom.pt"
policy_path: "locomotion_go2/contact_policy_stanceSeperate.pt"
# policy_path: "locomotion_go2/contact_policy_latest.pt"
fixed_feet_positions: false
control_dt: 0.005
decimation: 4
action_dim: 12
action_scale: 0.35
stiffness: &stiffness 30.0
damping: &damping 0.5
use_threading: false
use_buffer: false
device: 'cpu' # "cuda:0"  
feet_step_size: 0.0
horizon_length: &horizon_length 5 # footstep horizon
action_filter_alpha: 0.5
transition_duration: 0
visualize: 
  future_feet_positions: false
  current_contact_locations: false
  opt_contact_locations: true
  feet_error: false
  contact_plan: false
  foot_forces: false
  contact_status: false


ISAAC_LAB_DEFAULT_JOINT_POS: &ISAAC_LAB_DEFAULT_JOINT_POS [
    0.1000, # 0
    -0.1000, # 1
    0.1000, # 2
    -0.1000, # 3
    0.8000, # 4
    0.8000, # 5
    1.0000, # 6
    1.0000, # 7
    -1.5000, # 8
    -1.5000, # 9
    -1.5000, # 10
    -1.5000, # 11
  ] # from asset.data.default_joint_pos; corresponds to ISAACLAB_JOINT_ORDER; is used as action offset


# MPS stuff
mps_task_name: "QuadRLTask"
timestep: 0.03

obs_horizon: 2 # specific to RL policy
command_duration: 0.3

# Use the correct mapping from the existing config
# JOINT_OBSERVATION_UNITREE_TO_ISAAC_LAB_MAPPING: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
# DoomMPC/src/utils/joint_mapping.py for go2
joint_obs_unitree_to_isaac_mapping: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]

# same as ISAAC_LAB_DEFAULT_JOINT_POS
default_joint_pos: *ISAAC_LAB_DEFAULT_JOINT_POS

action_mapping: [1, 5, 9, 0, 4, 8, 3, 7, 11, 2, 6, 10]

# DoomMPC/src/robots/go2/go2.py
foot_names: ["FL_foot", "FR_foot", "RL_foot", "RR_foot"]

# 0.3 noise for [-1, 1] normalized
# plan_lim in meters would be 0.3 * 0.25 (action scale) = 0.075 m
plan_lim: 0.25
act_rl_clip: 100 # there is no clip on actions actually
action_offset: *ISAAC_LAB_DEFAULT_JOINT_POS

# TODO: use limits
j_pd_min: -100.0
j_pd_max: 100.0

kp: *stiffness
kd: *damping

mps_alg_name: "MIMPS"
mps_num_samples: 512
mps_noise_level: 0.3        # was 0.3; larger noise allows bigger lateral body shifts (0.2m/step)
mps_temperature: 1.0
mps_plan_horizon: *horizon_length
mps_iterations: 1           # keep 1: more iterations doubles plan latency (~2.6s), hurting timing
mps_gamma: 0.99
mps_safety_weight: 10
mps_collect_data: true
mps_top_fraction: 0.01
apply_mpc_contact_plan: false

# Obstacle avoidance cost parameters
obstacle_cost_weight: 300.0
obstacle_cost_scale: 0.15   # Exponential decay length scale (meters). Larger = feel obstacles from further.

# Dynamic obstacle (ball) parameters
max_dynamic_obstacles: 5
ball_radius: 0.05
ball_mass: 0.5
ball_lifetime: 3.0                # Seconds on ground before auto-deactivation
ball_launch_distance: [8.0, 12.0]  # [min, max] meters from robot
ball_launch_height: [6.0, 9.0]    # [min, max] meters
ball_launch_speed: [0.5, 2.0]     # [min, max] m/s (lobbed arc)
dynamic_obs_cost_weight: 2000.0   # was 500; needs to dominate nominal tracking cost
dynamic_obs_cost_scale: 0.8       # was 1.5; steeper gradient forces decisive avoidance when close
mpc_latency_compensation: 1.3     # Seconds: expected MPS solve latency added to ball prediction dt.
                                  # t0 is always ~0 (tracker updated live each tick), so this
                                  # only compensates MPS solve time. Tune: if ball is already past
                                  # the robot when the plan fires, increase this value.
# dpcbf_k: 100                      # DPCBF parabolic safety param: widens lateral clearance requirement
#                                   # by sqrt(2*k*||v||*approach_dist). k=0 = plain perpendicular check.
#                                   # Increase to react earlier to fast/distant approaching balls.
