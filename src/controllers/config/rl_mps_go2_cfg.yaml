# ============================================================================
# DoomMPC: RL-MPS Controller Configuration for Unitree Go2
# ============================================================================

# ----------------------------------------------------------------------------
# POLICY
# ----------------------------------------------------------------------------
# Available policies in src/controllers/policies/locomotion_go2/:
#   - contact_policy_actuatorRand.pt
#   - contact_policy_feetRandom.pt
#   - contact_policy_stanceSeperate.pt
#   - contact_policy_stance2.pt
#   - contact_policy_latest.pt (current)
policy_path: "locomotion_go2/contact_policy_latest.pt"

fixed_feet_positions: false
device: 'cpu'  # or "cuda:0"

# ----------------------------------------------------------------------------
# CONTROL TIMING
# ----------------------------------------------------------------------------
control_dt: 0.005          # Main controller frequency (200 Hz)
decimation: 4              # RL policy decimation
command_duration: 0.3      # Duration per contact plan step
obs_horizon: 2             # Reference trajectory horizon for policy observations
timestep: 0.03             # MuJoCo physics timestep

# ----------------------------------------------------------------------------
# ACTION CONFIGURATION
# ----------------------------------------------------------------------------
action_dim: 12
action_scale: 0.35
action_filter_alpha: 0.5

# Joint ordering: maps Unitree hardware order to IsaacLab training order
joint_obs_unitree_to_isaac_mapping: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
action_mapping: [1, 5, 9, 0, 4, 8, 3, 7, 11, 2, 6, 10]

# Default joint positions (IsaacLab order)
# Used as action offset and for initialization
ISAAC_LAB_DEFAULT_JOINT_POS: &ISAAC_LAB_DEFAULT_JOINT_POS [
    0.1000,   # 0: FL hip
    -0.1000,  # 1: FR hip
    0.1000,   # 2: RL hip
    -0.1000,  # 3: RR hip
    0.8000,   # 4: FL thigh
    0.8000,   # 5: FR thigh
    1.0000,   # 6: RL thigh
    1.0000,   # 7: RR thigh
    -1.5000,  # 8: FL calf
    -1.5000,  # 9: FR calf
    -1.5000,  # 10: RL calf
    -1.5000,  # 11: RR calf
]
default_joint_pos: *ISAAC_LAB_DEFAULT_JOINT_POS
action_offset: *ISAAC_LAB_DEFAULT_JOINT_POS

# ----------------------------------------------------------------------------
# PD CONTROLLER
# ----------------------------------------------------------------------------
stiffness: &stiffness 30.0
damping: &damping 0.5
kp: *stiffness
kd: *damping

# Joint position limits for PD control (soft limits applied in code)
# Actual limits are joint_range * soft_dof_limit_factor (default 0.95)
soft_dof_limit_factor: 0.95
j_pd_min: -100.0  # Override if needed, otherwise uses soft limits
j_pd_max: 100.0

# ----------------------------------------------------------------------------
# PLANNING
# ----------------------------------------------------------------------------
horizon_length: &horizon_length 6    # Number of contact plan steps
plan_lim: 0.25                      # Plan normalization limit (meters)
act_rl_clip: 100                    # Action clipping (large = no effective clip)
feet_step_size: 0.0
transition_duration: 0

# ----------------------------------------------------------------------------
# OPTIMIZER
# ----------------------------------------------------------------------------
mps_alg_name: "CEMPS"  # MIMPS, REMIMPS, CEMPS, DMPS, CMPS

# Common parameters (all optimizers)
mps_num_samples: 1200
mps_plan_horizon: *horizon_length
mps_iterations: 1
mps_gamma: 0.99
mps_safety_weight: 10
mps_collect_data: true
mps_top_fraction: 0.02
mps_policy_decimation: 1

# Optimizer-specific parameters
MIMPS:
  noise_level: 0.6
  temperature: 1

REMIMPS:
  # Replica Exchange MIMPS: K replicas at different temperatures
  num_replicas: 10
  temp_min: 0.01       # Coldest replica (exploitation)
  temp_max: 1.0        # Hottest replica (exploration)
  swap_every: 1        # Propose swaps every N iterations
  # Noise level applies to coldest; hot replicas scale automatically
  noise_level: 0.6
  temperature: 1       # Not used directly (replicas have individual temps)

CEMPS:
  noise_level: 0.6
  elite_fraction: 0.1
  cross_entropy_decay: 0.8


# ----------------------------------------------------------------------------
# TASK
# ----------------------------------------------------------------------------
mps_task_name: "QuadRLTask"

# Foot identification (must match MJCF body names)
foot_names: ["FL_foot", "FR_foot", "RL_foot", "RR_foot"]

# ----------------------------------------------------------------------------
# COLLISION AVOIDANCE
# ----------------------------------------------------------------------------

# ---- Obstacle Geometry ----
# Minimum obstacle height for collision constraint (filters thin obstacles)
constraint_min_obstacle_height: 0.0005

# ---- Foot Projection ----
# Pushes sampled foot positions out of obstacles
projection_clearance: 0.08   # meters (foot_radius + safety_margin)
projection_iters: 3          # Active-set QP iterations

# ---- Cost Weights ----

# Foot chain cost: penalizes step-to-step displacement (shuffling regularizer)
# Weight guide: 0=off, 10=mild, 30=moderate, 50+=aggressive shuffle
foot_chain_weight: 1.0

# Body SDF cost: penalizes body center near obstacles
# margin: threshold distance (meters)
# scale: softplus sharpness (meters, smaller = sharper transition)
# weight: overall cost multiplier
body_sdf_margin: 0.2
body_sdf_scale: 0.2
body_sdf_weight: 1.0

# Foot path SDF cost: penalizes swing arcs through obstacles
# Evaluates SDF at interpolated points between stance and planned positions
foot_path_sdf_scale: 0.2
foot_path_sdf_weight: 1.0

# Foot tracking cost: penalizes deviation between actual and planned foot positions
# S2-style cost accumulated during rollout
foot_tracking_weight: 1.0

# Foot step cost: penalizes displacement from current stance (only at step 0)
# Disabled by default - use foot_chain_weight for regularization
foot_step_weight: 0.0

# ----------------------------------------------------------------------------
# PHYSICS SIMULATION
# ----------------------------------------------------------------------------
# MJX warp backend buffer sizing:
#   nconmax = TOTAL contacts across all parallel worlds
#   njmax = PER-WORLD efc rows (NOT scaled by num_samples)
# Empirical peaks: ~23 contacts/world, ~161 efc rows/world
mps_ncon_per_world: 32   # per-world budget; total = 32 * 400 = 12800
mps_njmax: 2100          # per-world; (400, 2048, 18) × 4 bytes = 59 MB after vmap; raised from 512 for chaotic contact geometry

# MuJoCo solver settings (reduced from defaults for speed)
physics_iterations: 4      # Newton solver iters (default 8)
physics_ls_iterations: 4   # Line-search iters (default 8)

apply_mpc_contact_plan: false  # Enable in code during runtime (slow to JIT)

# ----------------------------------------------------------------------------
# VISUALIZATION
# ----------------------------------------------------------------------------
visualize:
  future_feet_positions: false
  current_contact_locations: false
  opt_contact_locations: true
  feet_error: false
  contact_plan: false
  foot_forces: false
  contact_status: false

# ----------------------------------------------------------------------------
# DYNAMIC OBSTACLES (BALL LAUNCHER)
# ----------------------------------------------------------------------------
max_dynamic_obstacles: 5

ball_radius: 0.05
ball_mass: 0.5
ball_lifetime: 3.0              # Seconds on ground before auto-deactivation
ball_launch_distance: [8.0, 12.0]  # [min, max] meters from robot
ball_launch_height: [6.0, 9.0]    # [min, max] meters
ball_launch_speed: [0.5, 2.0]    # [min, max] m/s (lobbed arc)

# ---- Reserved for future use ----
# Dynamic obstacle cost parameters (currently handled via SDF projection)
# dynamic_obs_cost_weight: 2000.0
# dynamic_obs_cost_scale: 0.8
# mpc_latency_compensation: 1.3
# dpcbf_k: 100
