# ============================================================================
# DoomMPC: RL-MPS Controller Configuration for Unitree Go2
# ============================================================================

# ----------------------------------------------------------------------------
# POLICY
# ----------------------------------------------------------------------------
# Available policies in src/controllers/policies/locomotion_go2/:
#   - contact_policy_actuatorRand.pt
#   - contact_policy_feetRandom.pt
#   - contact_policy_stanceSeperate.pt
#   - contact_policy_stance2.pt
#   - contact_policy_latest.pt (current)
policy_path: "locomotion_go2/contact_policy_latest.pt"

fixed_feet_positions: false
device: 'cpu'  # or "cuda:0"

# ----------------------------------------------------------------------------
# CONTROL TIMING
# ----------------------------------------------------------------------------
control_dt: 0.005          # Main controller frequency (200 Hz)
decimation: 4              # RL policy decimation
command_duration: 0.45      # Duration per contact plan step
obs_horizon: 2             # Reference trajectory horizon for policy observations
timestep: 0.03             # MuJoCo physics timestep

# ----------------------------------------------------------------------------
# ACTION CONFIGURATION
# ----------------------------------------------------------------------------
action_dim: 12
action_scale: 0.35
action_filter_alpha: 0.1

# Joint ordering: maps Unitree hardware order to IsaacLab training order
joint_obs_unitree_to_isaac_mapping: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
action_mapping: [1, 5, 9, 0, 4, 8, 3, 7, 11, 2, 6, 10]

# Default joint positions (IsaacLab order)
# Used as action offset and for initialization
ISAAC_LAB_DEFAULT_JOINT_POS: &ISAAC_LAB_DEFAULT_JOINT_POS [
    0.1000,   # 0: FL hip
    -0.1000,  # 1: FR hip
    0.1000,   # 2: RL hip
    -0.1000,  # 3: RR hip
    0.8000,   # 4: FL thigh
    0.8000,   # 5: FR thigh
    1.0000,   # 6: RL thigh
    1.0000,   # 7: RR thigh
    -1.5000,  # 8: FL calf
    -1.5000,  # 9: FR calf
    -1.5000,  # 10: RL calf
    -1.5000,  # 11: RR calf
]
default_joint_pos: *ISAAC_LAB_DEFAULT_JOINT_POS
action_offset: *ISAAC_LAB_DEFAULT_JOINT_POS

# ----------------------------------------------------------------------------
# PD CONTROLLER
# ----------------------------------------------------------------------------
stiffness: &stiffness 30.0
damping: &damping 0.5
kp: *stiffness
kd: *damping

# Joint position limits for PD control (soft limits applied in code)
# Actual limits are joint_range * soft_dof_limit_factor (default 0.95)
soft_dof_limit_factor: 0.95
j_pd_min: -100.0  # Override if needed, otherwise uses soft limits
j_pd_max: 100.0

# ----------------------------------------------------------------------------
# GAIT
# ----------------------------------------------------------------------------
# Overriding default: joystick, eval, safety filter all use this gait unless
# explicitly overridden at runtime.  Must match a key in gait_patterns below.
default_gait: "trot"

# All available gait patterns (shared by controller and safety filter).
# Each gait is a list of boolean phases in [FL, FR, RL, RR] order.
# The controller and safety filter read from the same definition.
gait_patterns:
  stance:
    - [ true,  true,  true,  true]
    - [ true,  true,  true,  true]
  transition:
    - [ true,  true,  true,  true]
    - [ true,  true,  true,  true]
  trot:
    - [false,  true,  true, false]
    - [ true, false, false,  true]
  trot-jump1:
    - [false,  true,  true, false]
    - [false, false, false, false]
  trot-jump2:
    - [ true, false, false,  true]
    - [false, false, false, false]
  pace:
    - [ true, false,  true, false]
    - [false,  true, false,  true]
  pace-jump1:
    - [false, false, false, false]
    - [ true, false,  true, false]
  pace-jump2:
    - [false, false, false, false]
    - [false,  true, false,  true]
  bound:
    - [ true,  true, false, false]
    - [false, false,  true,  true]
  random1:
    - [ true, false, false, false]
    - [false,  true,  true,  true]
  random2:
    - [false,  true, false, false]
    - [ true, false,  true,  true]
  random3:
    - [false, false,  true, false]
    - [ true,  true, false,  true]
  random4:
    - [false, false, false,  true]
    - [ true,  true,  true, false]
  jump:
    - [false, false, false, false]
    - [ true,  true,  true,  true]
  crawl-anticlockwise:
    - [ true,  true,  true, false]
    - [ true,  true, false,  true]
    - [ true, false,  true,  true]
    - [false,  true,  true,  true]
  crawl-anticlockwise2:
    - [ true,  true,  true, false]
    - [ true,  true, false,  true]
    - [false,  true,  true,  true]
    - [ true, false,  true,  true]
  crawl-clockwise:
    - [ true,  true,  true, false]
    - [false,  true,  true,  true]
    - [ true, false,  true,  true]
    - [ true,  true, false,  true]
  trot-fly:
    - [false,  true,  true, false]
    - [false, false, false, false]
    - [ true, false, false,  true]
    - [false, false, false, false]

# ----------------------------------------------------------------------------
# PLANNING
# ----------------------------------------------------------------------------
horizon_length: &horizon_length 5    # Number of contact plan steps
plan_lim: 0.25                      # Plan normalization limit (meters)
act_rl_clip: 100                    # Action clipping (large = no effective clip)
feet_step_size: 0.0
transition_duration: 0

# ----------------------------------------------------------------------------
# OPTIMIZER
# ----------------------------------------------------------------------------
mps_alg_name: "REMIMPS"  # MIMPS, REMIMPS, CEMPS, CBF, HJ, DMPS, CMPS

# Common parameters (all optimizers)
mps_num_samples: 1200
mps_plan_horizon: *horizon_length
mps_iterations: 3
mps_gamma: &mps_gamma 0.99
mps_safety_weight: 10
mps_collect_data: true
mps_top_fraction: 0.3
mps_policy_decimation: 1
mps_use_momentum: false
mps_momentum: 0.5 # [-1, 1], if in [-1, 0] then EMA style damping, else extrapolation

# Optimizer-specific parameters
MIMPS:
  noise_level: 0.6
  temperature: 1

REMIMPS:
  # Replica Exchange MIMPS: K replicas at different temperatures
  num_replicas: 10
  temp_min: 0.01       # Coldest replica (exploitation)
  temp_max: 1.0        # Hottest replica (exploration)
  swap_every: 1        # Propose swaps every N iterations
  # Noise level applies to coldest; hot replicas scale automatically
  noise_level: 0.6
  temperature: 1       # Not used directly (replicas have individual temps)

CEMPS:
  noise_level: 0.6
  elite_fraction: 0.1
  cross_entropy_decay: 0.8

CBF:
  # Ablation: set enabled: false to skip CBF (only geometric projection applies)
  enabled: true
  # Ablation: set use_geometric_fallback: false to test CBF standalone
  use_geometric_fallback: false
  cross_entropy_decay: 0.5

HJ:
  hj_grid: [30, 20, 30, 20]
  hj_vi_iters: 40

# ----------------------------------------------------------------------------
# TASK
# ----------------------------------------------------------------------------
mps_task_name: "QuadRLTask"

# Foot identification (must match MJCF body names)
foot_names: ["FL_foot", "FR_foot", "RL_foot", "RR_foot"]

# ----------------------------------------------------------------------------
# COLLISION AVOIDANCE
# ----------------------------------------------------------------------------

# ---- Obstacle Geometry ----
# Minimum obstacle height for collision constraint (filters thin obstacles)
constraint_min_obstacle_height: 0.0001

# ---- Foot Projection ----
# Pushes sampled foot positions out of obstacles
# hardware 0.15
projection_clearance: 0.12   # meters (foot_radius + safety_margin)
projection_iters: 3          # iterations (for "iterative" method only)
projection_method: "iterative"  # "iterative" | "qp_single" | "qp_sqp"

# ---- Obstacle Height Classification ----
# Obstacles with half-height >= threshold → "tall" (navigate around, foot_plan_sdf_cost).
# Obstacles with half-height <  threshold → "short" (step over, body_sdf/foot_path_sdf).
# Navigation boxes (half-h=0.2m) → tall.  Cluttered debris (half-h=0.01m) → short.
cost_obstacle_height_threshold: 0.07  # half-height in metres

# ---- Cost Weights ----
# All costs are active simultaneously; each cost term sees only its height class.
#   Tall  → foot_plan_sdf_cost (exponential, long-range ~0.5m gradient)
#   Short → body_sdf_cost + foot_path_sdf_cost (softplus, precise near-field)

ref_tracking_weight: 30.0

# Foot chain cost: penalizes step-to-step displacement (shuffling regularizer)
# Weight guide: 0=off, 10=mild, 30=moderate, 50+=aggressive shuffle
foot_chain_weight: 40.0

# Body SDF cost: penalizes body center near obstacles (short obstacles only)
# margin: threshold distance (meters)
# scale: softplus sharpness (meters, smaller = sharper transition)
# weight: overall cost multiplier
# hardware 0.01
body_sdf_margin: 0.01
body_sdf_scale: 0.2
body_sdf_weight: 1.0

# Foot path SDF cost: penalizes swing arcs through obstacles (short obstacles only)
# Evaluates SDF at interpolated points between stance and planned positions
foot_path_sdf_scale: 0.2
foot_path_sdf_weight: 5.0

# Foot plan SDF cost: exponential penalty on planned foot positions (tall obstacles only)
# scale: exponential decay length (meters, larger = longer reach)
foot_plan_sdf_weight: 15.0
foot_plan_sdf_scale: 0.2

# Foot tracking cost: penalizes deviation between actual and planned foot positions
# S2-style cost accumulated during rollout
foot_tracking_weight: 50.0

# Foot step cost: penalizes displacement from current stance (only at step 0)
# Disabled by default - use foot_chain_weight for regularization
foot_step_weight: 0.0

# ----------------------------------------------------------------------------
# PHYSICS SIMULATION
# ----------------------------------------------------------------------------
# MJX warp backend buffer sizing:
#   nconmax = TOTAL contacts across all parallel worlds
#   njmax = PER-WORLD efc rows (NOT scaled by num_samples)
# Empirical peaks: ~23 contacts/world, ~161 efc rows/world
mps_ncon_per_world: 32   # per-world budget; total = 32 * 400 = 12800
mps_njmax: 2100          # per-world; (400, 2048, 18) × 4 bytes = 59 MB after vmap; raised from 512 for chaotic contact geometry

# MuJoCo solver settings (reduced from defaults for speed)
physics_iterations: 4      # Newton solver iters (default 8)
physics_ls_iterations: 4   # Line-search iters (default 8)

apply_mpc_contact_plan: false  # Enable in code during runtime (slow to JIT)

# ----------------------------------------------------------------------------
# VISUALIZATION
# ----------------------------------------------------------------------------
visualize:
  future_feet_positions: false
  current_contact_locations: false
  opt_contact_locations: true
  feet_error: false
  contact_plan: false
  foot_forces: false
  contact_status: false

# ----------------------------------------------------------------------------
# DYNAMIC OBSTACLES (BALL LAUNCHER)
# ----------------------------------------------------------------------------
max_dynamic_obstacles: 5

ball_radius: 0.05
ball_mass: 0.5
ball_lifetime: 3.0              # Seconds on ground before auto-deactivation
ball_launch_distance: [8.0, 12.0]  # [min, max] meters from robot
ball_launch_height: [6.0, 9.0]    # [min, max] meters
ball_launch_speed: [0.5, 2.0]    # [min, max] m/s (lobbed arc)

# ----------------------------------------------------------------------------
# LEARNED SAFETY TERMINAL VALUE FUNCTION
# ----------------------------------------------------------------------------
#
# Single switch controlling everything:
#   "off"       – no terminal cost in planner
#   "heuristic" – SDF heuristic only (no network loaded)
#   "direct"    – learned V(x) net replaces heuristic
#   "residual"  – learned Delta(x) net corrects heuristic
#
# Training follows deployment mode automatically.
#   direct   -> train targets = n-step return
#   residual -> train targets = n-step return - V_h(x_t)
#
safety_value_mode: "off"   # "off" | "heuristic" | "direct" | "residual"

# ---- Network architecture --------------------------------------------------
safety_value_hidden_dim: 256
safety_value_use_layer_norm: true
safety_value_use_feature_norm: true

# ---- Training hyperparameters ----------------------------------------------
safety_value_n_step: *horizon_length
safety_value_gamma: *mps_gamma
safety_value_lr: 3e-4
safety_value_batch_size: 8000
safety_value_num_epochs: 25000
safety_value_grad_clip: 100.0
safety_value_target_clip: 5000.0

# Warm-start from pre-trained checkpoint (optional)
safety_value_checkpoint_path: "safety_filter/quad/safety_value_checkpoint"

# Dump MPPI rollouts to disk for offline pre-training (optional)
safety_value_data_dir: null # null | "logs/safety_value_rollouts"
