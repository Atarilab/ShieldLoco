# policy_path: "locomotion_go2/contact_policy_feetRandom.pt"
# policy_path: "locomotion_go2/contact_policy_stanceSeperate.pt"
policy_path: "locomotion_go2/contact_policy_latest.pt"
# policy_path: "locomotion_go2/contact_policy_stance2.pt"
fixed_feet_positions: false
control_dt: 0.005
decimation: 4
action_dim: 12
action_scale: 0.35
stiffness: &stiffness 30.0
damping: &damping 0.5
use_threading: false
use_buffer: false
device: 'cpu' # "cuda:0"  
feet_step_size: 0.0
# H * dt > H_effective * dt + max_latency
horizon_length: &horizon_length 6 # footstep horizon
action_filter_alpha: 0.5
transition_duration: 0
visualize: 
  future_feet_positions: false
  current_contact_locations: false
  opt_contact_locations: true
  feet_error: false
  contact_plan: false
  foot_forces: false
  contact_status: false


ISAAC_LAB_DEFAULT_JOINT_POS: &ISAAC_LAB_DEFAULT_JOINT_POS [
    0.1000, # 0
    -0.1000, # 1
    0.1000, # 2
    -0.1000, # 3
    0.8000, # 4
    0.8000, # 5
    1.0000, # 6
    1.0000, # 7
    -1.5000, # 8
    -1.5000, # 9
    -1.5000, # 10
    -1.5000, # 11
  ] # from asset.data.default_joint_pos; corresponds to ISAACLAB_JOINT_ORDER; is used as action offset


# MPS stuff

# === OPTIMIZER ===

mps_alg_name: "MIMPS"

# === COMMON PARAMS (used by all optimizers) ===
mps_num_samples: 800
mps_plan_horizon: *horizon_length
mps_iterations: 2
mps_gamma: 0.99
mps_safety_weight: 1
mps_collect_data: true
mps_top_fraction: 0.02

# === OPTIMIZER-SPECIFIC PARAMS (nested by algorithm) ===

MIMPS:
  noise_level: 0.6
  temperature: 1

CEMPS:
  elite_fraction: 0.1
  max_iters: 5

DMPS:
  temperature: 1

CMPS:
  temperature: 1
  dt: 0.1


# === Task ===

mps_task_name: "QuadRLTask"
timestep: 0.03

obs_horizon: 2 # specific to RL policy
command_duration: 0.3
steps_per_reference_advance: 3  # 1 = advance every resample, 2 = every 2 resamples, etc.

# Use the correct mapping from the existing config
# JOINT_OBSERVATION_UNITREE_TO_ISAAC_LAB_MAPPING: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
# DoomMPC/src/utils/joint_mapping.py for go2
joint_obs_unitree_to_isaac_mapping: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]

# same as ISAAC_LAB_DEFAULT_JOINT_POS
default_joint_pos: *ISAAC_LAB_DEFAULT_JOINT_POS

action_mapping: [1, 5, 9, 0, 4, 8, 3, 7, 11, 2, 6, 10]

# DoomMPC/src/robots/go2/go2.py
foot_names: ["FL_foot", "FR_foot", "RL_foot", "RR_foot"]

# 0.3 noise for [-1, 1] normalized
# plan_lim in meters would be 0.3 * 0.25 (action scale) = 0.075 m
plan_lim: 0.25
act_rl_clip: 100 # there is no clip on actions actually
action_offset: *ISAAC_LAB_DEFAULT_JOINT_POS

# TODO: use limits
j_pd_min: -100.0
j_pd_max: 100.0

kp: *stiffness
kd: *damping

mps_policy_decimation: 1
# Minimum obstacle height (metres) to include in collision constraint.
# Thin obstacles (cables 4mm, phones 4mm) contact the 22mm foot sphere during
# normal stance — unavoidable, so they produce n_safe=0 for all samples.
# Set to e.g. 0.02 to only penalise obstacles tall enough to impede locomotion.
# 0.0 = include everything (old behaviour).
constraint_min_obstacle_height: 0.0005
# Foot-plan projection: pushes sampled & final foot positions out of obstacle
# interiors using iterative closest-obstacle projection.  Each iteration finds
# the worst-violated SDF constraint and pushes onto its boundary.
# n_iters=3 suffices for circles (exact in 1) and boxes/capsules (2-3 iters).
# projection_clearance = foot_radius + safety margin (metres).
projection_clearance: 0.08
projection_iters: 3

# Whole-body collision avoidance costs:
# foot_step_weight: penalises ||step0_feet - current_feet||^2 at goal_idx==0.
#   Reduces intermediate step collisions by preferring short first-step displacements.
# foot_chain_weight: penalises Σ ||foot_h - foot_{h-1}||^2 across ALL horizon steps.
#   Encourages shuffling (small step-to-step deltas) rather than big reachy swings.
#   Fires at ALL goal_idx values — plan-shape regularizer.
#   0 = off, 10 = mild shuffle, 30 = moderate, 50+ = aggressive shuffle.
# body_sdf_weight / margin / scale: smooth softplus cost when the robot
#   body center is within `margin` metres of any obstacle edge.  Provides
#   a gradient for MPPI to prefer less-cluttered paths.
# foot_step_weight: 5.0
foot_chain_weight: 1.0
body_sdf_weight: 1
body_sdf_margin: 0.2
body_sdf_scale: 0.2
# Foot path SDF cost: penalizes straight-line foot trajectories that cross
# through obstacle interiors.  Evaluates 2D SDF at interpolated points
# between current stance and planned position (and between consecutive
# planned positions).  Prevents MPPI from selecting plans where the RL
# policy's intermediate steps would land on obstacles.
# 0 = off, 10 = mild, 30 = moderate (matches foot_chain_weight), 50+ = aggressive.
foot_path_sdf_weight: 1.0
foot_path_sdf_scale: 0.2  # softplus sharpness for foot-path SDF penalty (metres); tune independently of body_sdf_scale
foot_tracking_weight: 1.0  # S2: penalize actual-vs-planned foot position error during rollout (0=off, tune up)

# Contact buffer sizing — two different semantics in the warp backend:
#   nconmax = TOTAL across all worlds → allocated as ncon_per_world * num_samples.
#   njmax   = PER-WORLD efc rows     → NOT scaled; after vmap efc_J = (N, njmax, nv).
# Empirical peaks: ~23 contacts/world, ~161 efc rows/world.
mps_ncon_per_world: 32   # per-world budget; total = 32 * 400 = 12800
mps_njmax: 512            # per-world; (400, 512, 18) × 4 bytes = 14.7 MB after vmap
apply_mpc_contact_plan: false # enabled in code during run cuz jit compile is slow

# --- Speed tuning ---
physics_iterations: 4     # Newton solver iters per MJX step (default 8). 4 ≈ 2x faster sim, slight accuracy loss.
physics_ls_iterations: 4  # Line-search iters (default 8). Pair with physics_iterations.


# Dynamic obstacle (ball) parameters
max_dynamic_obstacles: 5
ball_radius: 0.05
ball_mass: 0.5
ball_lifetime: 3.0                # Seconds on ground before auto-deactivation
ball_launch_distance: [8.0, 12.0]  # [min, max] meters from robot
ball_launch_height: [6.0, 9.0]    # [min, max] meters
ball_launch_speed: [0.5, 2.0]     # [min, max] m/s (lobbed arc)
# dynamic_obs_cost_weight: 2000.0   # was 500; needs to dominate nominal tracking cost
# dynamic_obs_cost_scale: 0.8       # was 1.5; steeper gradient forces decisive avoidance when close
# mpc_latency_compensation: 1.3     # Seconds: expected MPS solve latency added to ball prediction dt.
#                                   # t0 is always ~0 (tracker updated live each tick), so this
#                                   # only compensates MPS solve time. Tune: if ball is already past
#                                   # the robot when the plan fires, increase this value.
# # dpcbf_k: 100                      # DPCBF parabolic safety param: widens lateral clearance requirement
# #                                   # by sqrt(2*k*||v||*approach_dist). k=0 = plain perpendicular check.
# #                                   # Increase to react earlier to fast/distant approaching balls.
